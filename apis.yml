name: Rapidfolio
description: >-
  Rapidfolio is an AI operations platform for financial-services companies that
  automates back-office workflows — KYC/KYB and identity verification, lending
  underwriting, payment-dispute and fraud investigation, reconciliation, and
  OFAC/sanctions and regulatory reviews. Teams define procedures as visual
  workflow graphs (Tool Call, Human Review, Wait, and Condition nodes) and
  Rapidfolio's AI agent executes them with deterministic, auditable outputs and
  a complete per-run step log. It ships isolated Sandbox and Live environments,
  a Runner API and Dashboard API (API-key auth), HMAC-SHA256-signed webhooks,
  human-review approvals with idempotency keys, a Node.js Connection SDK for
  private connections to internal services, and 20+ built-in integrations
  (Slack, Jira, Linear, Stripe, GoCardless, Onfido, Alloy, Flagright, Xero).
  A Y Combinator (Summer 2026) company based in San Francisco.
